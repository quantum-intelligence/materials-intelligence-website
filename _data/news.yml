- year: 2023
  tag: Highlight
  title: ALCF science highlight
  body: >-
    The lab's investigation "Materials Informatics Study of Two-Dimensional
    Magnetic Materials" was designated an Argonne Leadership Computing
    Facility science highlight.
- year: 2023
  tag: Media
  title: Rensselaer News covers AI-guided van der Waals magnets study
  body: >-
    Rensselaer News published coverage of the group's article in Advanced
    Theory and Simulations, "Artificial Intelligence Guided Studies of van
    der Waals Magnets."
- year: 2022
  tag: Award
  title: Joseph A. Johnson Award
  body: >-
    Professor Rhone was honored by AIP and the National Society of Black
    Physicists for work combining computer simulations and artificial
    intelligence to navigate an estimated 10^100 candidate materials.
- year: 2021
  tag: Award
  title: NSF CAREER Award
  body: >-
    Professor Rhone secured a competitive five-year NSF CAREER grant
    supporting early-career researchers with strong innovation potential in
    materials discovery acceleration.
