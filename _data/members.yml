- key: faculty
  title: Faculty
  people:
    - name: Trevor David Rhone
      role: Principal Investigator, Professor
      initials: TR
      bio: >-
        Liberal arts education from Macalester College and a PhD from Columbia
        University studying quantum electron systems. Research experience at
        NTT Basic Research Labs and the National Institute for Materials
        Science in Japan, followed by a transition into materials informatics
        and machine learning for 2D magnetic materials discovery at Harvard.
      links:
        linkedin: "https://www.linkedin.com/in/trevor-david-rhone-965ba9b/"
        twitter: "https://x.com/quantumcanvas"

