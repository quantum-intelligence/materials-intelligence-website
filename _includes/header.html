<header class="site-header">
  <div class="wrap site-header__inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <span class="brand__mark" aria-hidden="true">
        <svg viewBox="0 0 40 40" width="32" height="32">
          <circle cx="20" cy="20" r="3.2" fill="currentColor"/>
          <ellipse cx="20" cy="20" rx="17" ry="7" fill="none" stroke="currentColor" stroke-width="1.6"/>
          <ellipse cx="20" cy="20" rx="17" ry="7" fill="none" stroke="currentColor" stroke-width="1.6" transform="rotate(60 20 20)"/>
          <ellipse cx="20" cy="20" rx="17" ry="7" fill="none" stroke="currentColor" stroke-width="1.6" transform="rotate(120 20 20)"/>
        </svg>
      </span>
      <span class="brand__text">Materials<em>Intelligence</em></span>
    </a>

    <button class="nav-toggle" id="navToggle" aria-expanded="false" aria-controls="siteNav" aria-label="Toggle navigation menu">
      <span></span><span></span><span></span>
    </button>

    <nav class="site-nav" id="siteNav">
      <ul>
        {% for item in site.nav %}
          {% assign is_active = false %}
          {% if page.url == item.url %}{% assign is_active = true %}{% endif %}
          <li><a href="{{ item.url | relative_url }}" {% if is_active %}aria-current="page" class="active"{% endif %}>{{ item.title }}</a></li>
        {% endfor %}
      </ul>
    </nav>
  </div>
</header>
